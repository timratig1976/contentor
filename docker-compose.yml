services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: content-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - content-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: content-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - content-network
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    container_name: content-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: content_app
      POSTGRES_USER: content
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - content-network

networks:
  content-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
